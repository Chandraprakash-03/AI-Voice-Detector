# Docker Compose configuration for AI-Generated Voice Detection API

version: "3.8"

services:
  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: voice-detection-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    env_file:
      - .env.production
    volumes:
      - ./models:/app/models:ro # Mount models directory (read-only)
      - ./logs:/app/logs # Mount logs directory
      - ./certs:/app/certs:ro # Mount SSL certificates (read-only)
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - voice-detection-network
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: voice-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - voice-detection-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: voice-detection-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - voice-detection-network

volumes:
  redis_data:
    driver: local

networks:
  voice-detection-network:
    driver: bridge
